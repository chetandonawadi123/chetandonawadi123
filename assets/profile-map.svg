    <text x="135" y="155">FastAPI · REST APIs</text>
    <text x="765" y="140">Apache Kafka</text>
    <text x="765" y="155">Apache Spark</text>
    <text x="115" y="303">MySQL</text>
    <text x="115" y="318">PostgreSQL</text>
    <text x="785" y="303">AWS EC2 · S3 · Docker</text>
    <text x="785" y="318">Linux · Git</text>
    <text x="135" y="466">ROS · LiDAR · Gazebo</text>
    <text x="135" y="481">Hector SLAM</text>
    <text x="765" y="466">TensorFlow · SVM · ANN</text>
    <text x="765" y="481">MedGAN · RL</text>
  </g>

  <!-- center node -->
  <circle cx="450" cy="290" r="118" fill="url(#core)"/>
  <circle cx="450" cy="290" r="78" fill="#0D1117" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <circle cx="450" cy="290" r="78" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.6">
    <animate attributeName="r" values="78;112;78" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
