<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22D3EE" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.02"/>
    </radialGradient>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="580" rx="14" fill="#0A0E14" stroke="#22D3EE" stroke-opacity="0.35"/>
  <rect width="900" height="580" rx="14" fill="url(#grid)"/>

  <!-- title bar -->
  <rect width="900" height="34" rx="14" fill="#0D1117"/>
  <rect y="20" width="900" height="14" fill="#0D1117"/>
  <circle cx="24" cy="17" r="5" fill="#FF5F56"/>
  <circle cx="44" cy="17" r="5" fill="#FFBD2E"/>
  <circle cx="64" cy="17" r="5" fill="#27C93F"/>
  <text x="450" y="22" text-anchor="middle" fill="#8B949E" font-size="12">chetan@dev: ~/profile-map</text>

  <!-- connection lines -->
  <g stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <line x1="450" y1="290" x2="135" y2="127"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="765" y2="127"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="115" y2="290"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="785" y2="290"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="135" y2="453"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="765" y2="453"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- cluster boxes -->
  <g stroke="#A78BFA" stroke-width="1.3" fill="#0D1117">
    <rect x="40"  y="90"  width="190" height="74" rx="8"/>
    <rect x="670" y="90"  width="190" height="74" rx="8"/>
    <rect x="20"  y="253" width="190" height="74" rx="8"/>
    <rect x="690" y="253" width="190" height="74" rx="8"/>
    <rect x="40"  y="416" width="190" height="74" rx="8"/>
    <rect x="670" y="416" width="190" height="74" rx="8"/>
  </g>

  <!-- cluster text -->
  <g font-size="14" font-weight="700" fill="#22D3EE" text-anchor="middle">
    <text x="135" y="118">BACKEND</text>
    <text x="765" y="118">STREAMING</text>
    <text x="115" y="281">DATABASES</text>
    <text x="785" y="281">CLOUD &amp; DEVOPS</text>
    <text x="135" y="444">ROBOTICS</text>
    <text x="765" y="444">ML / AI</text>
  </g>
  <g font-size="11.5" fill="#C9D1D9" text-anchor="middle">
