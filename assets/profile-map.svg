<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00FF41" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0.02"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="580" rx="14" fill="#0A0E14" stroke="#00FF41" stroke-opacity="0.35"/>
  <rect width="900" height="580" rx="14" fill="url(#grid)"/>

  <!-- title bar -->
  <rect width="900" height="34" rx="14" fill="#0D1117"/>
  <rect y="20" width="900" height="14" fill="#0D1117"/>
  <circle cx="24" cy="17" r="5" fill="#FF5F56"/>
  <circle cx="44" cy="17" r="5" fill="#FFBD2E"/>
  <circle cx="64" cy="17" r="5" fill="#27C93F"/>
  <text x="450" y="22" text-anchor="middle" fill="#8B949E" font-size="12">chetan@dev: ~/profile-map</text>

  <!-- connection lines -->
  <g stroke="#00FF41" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <line x1="450" y1="290" x2="135" y2="127"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="765" y2="127"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="115" y2="290"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="785" y2="290"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="135" y2="453"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="450" y1="290" x2="765" y2="453"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- cluster boxes -->
  <g stroke="#00E5FF" stroke-width="1.3" fill="#0D1117">
    <rect x="40"  y="90"  width="190" height="74" rx="8"/>
    <rect x="670" y="90"  width="190" height="74" rx="8"/>
    <rect x="20"  y="253" width="190" height="74" rx="8"/>
    <rect x="690" y="253" width="190" height="74" rx="8"/>
    <rect x="40"  y="416" width="190" height="74" rx="8"/>
    <rect x="670" y="416" width="190" height="74" rx="8"/>
  </g>

  <!-- cluster text -->
  <g font-size="14" font-weight="700" fill="#00FF41" text-anchor="middle">
    <text x="135" y="118">BACKEND</text>
    <text x="765" y="118">STREAMING</text>
    <text x="115" y="281">DATABASES</text>
    <text x="785" y="281">CLOUD &amp; DEVOPS</text>
    <text x="135" y="444">ROBOTICS</text>
    <text x="765" y="444">ML / AI</text>
  </g>
  <g font-size="11.5" fill="#C9D1D9" text-anchor="middle">
    <text x="135" y="140">Spring Boot · Flask</text>
    <text x="135" y="155">FastAPI · REST APIs</text>
    <text x="765" y="140">Apache Kafka</text>
    <text x="765" y="155">Apache Spark</text>
    <text x="115" y="303">MySQL</text>
    <text x="115" y="318">PostgreSQL</text>
    <text x="785" y="303">AWS EC2 · S3 · Docker</text>
    <text x="785" y="318">Linux · Git</text>
    <text x="135" y="466">ROS · LiDAR · Gazebo</text>
    <text x="135" y="481">Hector SLAM</text>
    <text x="765" y="466">TensorFlow · SVM · ANN</text>
    <text x="765" y="481">MedGAN · RL</text>
  </g>

  <!-- center node -->
  <circle cx="450" cy="290" r="118" fill="url(#core)"/>
  <circle cx="450" cy="290" r="78" fill="#0D1117" stroke="#00FF41" stroke-width="2" filter="url(#glow)"/>
  <circle cx="450" cy="290" r="78" fill="none" stroke="#00FF41" stroke-width="1" stroke-opacity="0.6">
    <animate attributeName="r" values="78;112;78" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="276" text-anchor="middle" fill="#00FF41" font-size="19" font-weight="700" filter="url(#glow)">CHETAN</text>
  <text x="450" y="298" text-anchor="middle" fill="#00FF41" font-size="19" font-weight="700" filter="url(#glow)">DONAWADI</text>
  <text x="450" y="320" text-anchor="middle" fill="#8B949E" font-size="11">Backend Engineer</text>

  <!-- projects row -->
  <text x="450" y="522" text-anchor="middle" fill="#00E5FF" font-size="12" font-weight="700">$ ls ~/projects</text>
  <text x="450" y="544" text-anchor="middle" fill="#C9D1D9" font-size="12">firmpot/  ·  predictive-maintenance/  ·  budget-expense-tracker/  ·  hector-slam-robot/</text>
  <text x="450" y="565" text-anchor="middle" fill="#8B949E" font-size="11">B.Tech CSE @ PES University (2026)  ·  AWS Certified Cloud Practitioner</text>
</svg>
